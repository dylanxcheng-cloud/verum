name: Verum Auto Publisher

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run auto publisher
        env:
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          NETLIFY_AUTH_TOKEN:   ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:      ${{ secrets.NETLIFY_SITE_ID }}
        run: python auto_publish.py

      - name: Commit updated stories.json
        run: |
          git config --global user.name  "Verum Bot"
          git config --global user.email "bot@verumnews.app"
          git add stories.json
          git diff --staged --quiet || git commit -m "Auto publish: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
