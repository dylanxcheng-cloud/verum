<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verum</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,400;0,600;0,700;1,400&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--yellow:#FFD000;--black:#0D0D0D;--dark:#1A1A1A;--gray:#888;--light-gray:#C8C8C8;--white:#F5F5F0;--red:#E5292A}html{scroll-behavior:smooth}body{background:#141414;color:var(--white);font-family:'Barlow',sans-serif;font-size:16px;line-height:1.6;min-height:100vh}a{color:inherit;text-decoration:none}.topbar{background:var(--yellow);padding:6px 24px;display:flex;justify-content:space-between;align-items:center}.topbar-date{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--black);letter-spacing:1px;text-transform:uppercase}.topbar-links{display:flex;gap:20px}.topbar-links a{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--black);letter-spacing:1px;text-transform:uppercase;transition:opacity .15s}.topbar-links a:hover{opacity:.6}.masthead{background:var(--black);border-bottom:4px solid var(--yellow);padding:28px 24px 20px;text-align:center}.masthead-logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(52px,10vw,96px);line-height:.9;letter-spacing:2px;color:var(--yellow)}.masthead-logo .bull{color:var(--white)}.masthead-rule{width:80px;height:3px;background:var(--yellow);margin:14px auto 12px}.masthead-tagline{font-size:13px;font-style:italic;color:var(--gray)}nav{background:var(--dark);border-bottom:1px solid #333;position:sticky;top:0;z-index:100}.nav-inner{max-width:1100px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none}.nav-inner::-webkit-scrollbar{display:none}.nav-item{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--light-gray);padding:14px 20px;white-space:nowrap;border-bottom:3px solid transparent;transition:color .15s,border-color .15s;cursor:pointer}.nav-item:hover,.nav-item.active{color:var(--yellow);border-bottom-color:var(--yellow)}.breaking{background:var(--red);padding:10px 24px;display:flex;align-items:center;gap:14px;overflow:hidden}.breaking-label{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;color:var(--black);background:var(--yellow);padding:2px 10px;white-space:nowrap;flex-shrink:0}.breaking-ticker{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;flex:1}.breaking-ticker span{display:inline-block;animation:ticker 26s linear infinite}@keyframes ticker{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}.page{max-width:1100px;margin:0 auto;padding:28px 24px}.loading{text-align:center;padding:60px;color:var(--gray);font-family:'Barlow Condensed',sans-serif;font-size:18px;letter-spacing:2px}.clickable{cursor:pointer}.hero{display:grid;grid-template-columns:1fr 320px;gap:2px;background:#222;margin-bottom:2px}.hero-main{position:relative;min-height:420px;overflow:hidden;background:#2a2a2a}.hero-main img{width:100%;height:100%;min-height:420px;object-fit:cover;display:block;transition:transform .3s}.hero-main:hover img{transform:scale(1.02)}.hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.95) 0%,rgba(0,0,0,.2) 60%,transparent 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:28px}.hero-cat{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;background:var(--yellow);color:var(--black);padding:3px 10px;margin-bottom:12px;width:fit-content}.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(26px,4vw,42px);line-height:1.05;color:var(--white);margin-bottom:10px}.hero-meta{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:#aaa}.hero-meta strong{color:var(--yellow)}.hero-stack{display:flex;flex-direction:column;gap:2px}.hero-stack-item{background:var(--dark);border-left:3px solid transparent;transition:border-color .15s,background .15s;flex:1;display:flex;flex-direction:column;overflow:hidden}.hero-stack-item:hover{border-left-color:var(--yellow);background:#222}.stack-thumb{height:80px;overflow:hidden;background:#2a2a2a;flex-shrink:0}.stack-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .3s}.hero-stack-item:hover .stack-thumb img{transform:scale(1.05)}.stack-body{padding:12px 14px;flex:1;display:flex;flex-direction:column;justify-content:center}.stack-cat{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--yellow);margin-bottom:4px}.stack-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--white);line-height:1.3;margin-bottom:4px}.stack-meta{font-size:11px;color:var(--gray)}.section-header{display:flex;align-items:center;gap:14px;margin:32px 0 16px}.section-header-label{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--yellow);white-space:nowrap}.section-header-line{flex:1;height:1px;background:#333}.story-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#222}.story-card{background:var(--dark);transition:background .15s;display:flex;flex-direction:column}.story-card:hover{background:#222}.story-thumb{height:150px;overflow:hidden;background:#2a2a2a;flex-shrink:0}.story-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .3s}.story-card:hover .story-thumb img{transform:scale(1.05)}.story-body{padding:14px;flex:1;display:flex;flex-direction:column}.story-cat{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--yellow);margin-bottom:6px}.story-title{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;color:var(--white);line-height:1.3;flex:1;margin-bottom:8px}.story-card:hover .story-title{color:var(--yellow)}.story-meta{font-size:11px;color:var(--gray)}.content-row{display:grid;grid-template-columns:1fr 290px;gap:28px;margin-top:4px}.world-list{display:flex;flex-direction:column;gap:2px;background:#222}.world-item{background:var(--dark);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;border-left:3px solid transparent;transition:border-color .15s,background .15s}.world-item:hover{border-left-color:var(--yellow);background:#222}.world-item:hover .world-title{color:var(--yellow)}.world-flag{font-size:22px;flex-shrink:0;margin-top:2px}.world-region{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--yellow);margin-bottom:4px}.world-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--white);line-height:1.3;margin-bottom:4px;transition:color .15s}.world-meta{font-size:11px;color:var(--gray)}.sidebar{display:flex;flex-direction:column;gap:20px}.sidebar-widget{background:var(--dark);border-top:3px solid var(--yellow)}.widget-header{padding:10px 14px;border-bottom:1px solid #2a2a2a}.widget-title{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:2px;color:var(--yellow)}.widget-body{padding:10px 14px}.most-read-item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #242424;cursor:pointer}.most-read-item:last-child{border-bottom:none}.most-read-num{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#333;flex-shrink:0;width:26px;line-height:1}.most-read-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--white);line-height:1.3}.most-read-item:hover .most-read-title{color:var(--yellow)}.event-item{padding:9px 0;border-bottom:1px solid #242424}.event-item:last-child{border-bottom:none}.event-date{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--yellow);margin-bottom:3px}.event-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--white);line-height:1.3}.event-loc{font-size:11px;color:var(--gray);margin-top:2px}footer{background:var(--black);border-top:4px solid var(--yellow);margin-top:48px;padding:32px 24px 20px;text-align:center}.footer-logo{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;color:var(--yellow);margin-bottom:8px}.footer-logo .bull{color:var(--white)}.footer-tagline{font-size:13px;color:var(--gray);font-style:italic;margin-bottom:20px}.footer-links{display:flex;justify-content:center;gap:24px;margin-bottom:20px;flex-wrap:wrap}.footer-links a{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gray);transition:color .15s}.footer-links a:hover{color:var(--yellow)}.footer-copy{font-size:12px;color:#555}@media(max-width:768px){.hero{grid-template-columns:1fr}.story-grid{grid-template-columns:1fr 1fr}.content-row{grid-template-columns:1fr}.topbar-links{display:none}}@media(max-width:480px){.story-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar"><span class="topbar-date" id="site-date"></span><div class="topbar-links"><a href="about.html">About</a><a href="contact.html">Submit a Tip</a><a href="contact.html">Contact</a></div></div></div>
<div class="masthead"><div class="masthead-logo">Verum</div><div class="masthead-rule"></div><div class="masthead-tagline">"The truth for all."</div></div>
<nav><div class="nav-inner"><span class="nav-item" data-page="home" onclick="location.href='index.html'">Home</span><span class="nav-item" data-page="news" onclick="location.href='category.html?cat=News'">News</span><span class="nav-item" data-page="world" onclick="location.href='category.html?cat=World'">World</span><span class="nav-item" data-page="politics" onclick="location.href='category.html?cat=Politics'">Politics</span><span class="nav-item" data-page="sports" onclick="location.href='category.html?cat=Sports'">Sports</span><span class="nav-item" data-page="health" onclick="location.href='category.html?cat=Health'">Health</span><span class="nav-item" data-page="science" onclick="location.href='category.html?cat=Science'">Science</span></div></nav>
<div class="breaking"><span class="breaking-label">Breaking</span><div class="breaking-ticker"><span id="breaking-text">Loading...</span></div></div>
<div class="page" id="main-content"><div class="loading">Loading stories...</div></div>
<footer><div class="footer-logo">Verum</div><div class="footer-tagline">"The truth for all."</div><div class="footer-links"><a href="index.html">Home</a><a href="category.html?cat=News">News</a><a href="category.html?cat=World">World</a><a href="category.html?cat=Politics">Politics</a><a href="category.html?cat=Sports">Sports</a><a href="category.html?cat=Health">Health</a><a href="category.html?cat=Science">Science</a><a href="about.html">About</a><a href="contact.html">Contact</a></div><div class="footer-copy" id="footer-copy"></div></footer>
<script>
function timeAgo(ts){const diff=Math.floor((Date.now()-new Date(ts))/1000);if(diff<60)return"Just now";if(diff<3600){const m=Math.floor(diff/60);return m+"minute"+(m>1?"s":"")+" ago";}if(diff<86400){const h=Math.floor(diff/3600);return h+"hour"+(h>1?"s":"")+" ago";}if(diff<604800){const d=Math.floor(diff/86400);return d+"day"+(d>1?"s":"")+" ago";}return new Date(ts).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}
const go=id=>window.location.href=`article.html?id=${id}`;
document.getElementById('site-date').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
document.getElementById('footer-copy').textContent=`© ${new Date().getFullYear()} Verum. All rights reserved.`;
fetch('stories.json').then(r=>r.json()).then(d=>{
document.getElementById('breaking-text').textContent=d.breaking;
document.getElementById('main-content').innerHTML=`
<div class="hero">
<div class="hero-main clickable" onclick="go('${d.hero.id}')">
<img src="${d.hero.image}" alt="${d.hero.title}" onerror="this.style.opacity=0">
<div class="hero-overlay"><span class="hero-cat">${d.hero.category}</span><div class="hero-title">${d.hero.title}</div><div class="hero-meta"><strong>By ${d.hero.author}</strong> &nbsp;·&nbsp; ${timeAgo(d.hero.time)} &nbsp;·&nbsp; ${d.hero.read}</div></div>
</div>
<div class="hero-stack">${d.stack.map(s=>`<div class="hero-stack-item clickable" onclick="go('${s.id}')"><div class="stack-thumb"><img src="${s.image}" alt="${s.title}" onerror="this.style.opacity=0"></div><div class="stack-body"><div class="stack-cat">${s.category}</div><div class="stack-title">${s.title}</div><div class="stack-meta">${timeAgo(s.time)} · ${s.author}</div></div></div>`).join('')}</div>
</div>
<div class="section-header"><span class="section-header-label">Latest News</span><div class="section-header-line"></div></div>
<div class="story-grid">${d.latest.map(s=>`<div class="story-card clickable" onclick="go('${s.id}')"><div class="story-thumb"><img src="${s.image}" alt="${s.title}" onerror="this.style.opacity=0"></div><div class="story-body"><div class="story-cat">${s.category}</div><div class="story-title">${s.title}</div><div class="story-meta">${timeAgo(s.time)} · ${s.author}</div></div></div>`).join('')}</div>
<div class="content-row"><div>
<div class="section-header"><span class="section-header-label">World</span><div class="section-header-line"></div></div>
<div class="world-list">${d.world.map(s=>`<div class="world-item clickable" onclick="go('${s.id}')"><span class="world-flag">${s.flag}</span><div><div class="world-region">${s.region}</div><div class="world-title">${s.title}</div><div class="world-meta">${timeAgo(s.time)} · ${s.source}</div></div></div>`).join('')}</div>
</div>
<div class="sidebar">
<div class="sidebar-widget"><div class="widget-header"><span class="widget-title">Most Read</span></div><div class="widget-body">${d.mostRead.map((t,i)=>`<div class="most-read-item"><span class="most-read-num">${i+1}</span><span class="most-read-title">${t}</span></div>`).join('')}</div></div>
<div class="sidebar-widget"><div class="widget-header"><span class="widget-title">Upcoming Events</span></div><div class="widget-body">${d.events.map(e=>`<div class="event-item"><div class="event-date">${e.date}</div><div class="event-title">${e.title}</div><div class="event-loc">${e.location}</div></div>`).join('')}</div></div>
</div></div>`;
}).catch(()=>{document.getElementById('main-content').innerHTML='<div class="loading">Could not load stories.</div>';});
</script>
<script src="shared.js"></script>
</body>
</html>
