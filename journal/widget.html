<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daybook widget</title>
  <meta name="theme-color" content="#7c5cff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Daybook widget">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    :root {
      --bg: #f6f6fa; --surface: #ffffff; --text: #17172b; --muted: #6b6b80; --border: #e3e3ec;
      --accent: #7c5cff; --success: #2fa66a; color-scheme: light;
    }
    :root[data-theme='dark'] { --bg: #0f1020; --surface: #181a2f; --text: #f2f2f8; --muted: #9a9ab5; --border: #2b2d48; color-scheme: dark; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) { --bg: #0f1020; --surface: #181a2f; --text: #f2f2f8; --muted: #9a9ab5; --border: #2b2d48; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, Inter, Roboto, system-ui, sans-serif;
      background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
      display: flex; align-items: stretch; justify-content: center; padding: 8px;
    }
    body.standalone { padding: max(12px, env(safe-area-inset-top)) 12px 12px; }
    .widget {
      background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 14px 16px;
      width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;
      box-shadow: 0 1px 2px rgba(20,20,40,.06), 0 8px 24px rgba(20,20,40,.06);
    }
    .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .head .date { font-weight: 700; font-size: .95rem; }
    .head .date small { display: block; font-weight: 500; color: var(--muted); font-size: .75rem; }
    .ring { position: relative; width: 52px; height: 52px; flex: none; }
    .ring svg { transform: rotate(-90deg); display: block; }
    .ring .track { stroke: var(--border); }
    .ring .bar { stroke: var(--accent); transition: stroke-dasharray .3s; }
    .ring .label { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: .78rem; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--border); font-size: .9rem; min-width: 0; }
    li:first-child { border-top: 0; }
    .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--border); flex: none; display: grid; place-items: center; cursor: pointer; }
    .box svg { width: 12px; height: 12px; stroke: #fff; stroke-width: 3; fill: none; opacity: 0; }
    li.done .box { background: var(--success); border-color: var(--success); }
    li.done .box svg { opacity: 1; }
    li.done .name { color: var(--muted); text-decoration: line-through; }
    .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .time { color: var(--muted); font-size: .78rem; flex: none; }
    .day { color: var(--accent); font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
    .section { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .empty { color: var(--muted); font-size: .85rem; }
    .foot { display: flex; justify-content: space-between; align-items: center; font-size: .72rem; color: var(--muted); }
    .foot a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .size-small .events, .size-small .section, .size-small .habits-list, .size-small .foot { display: none; }
    .size-small .widget { justify-content: center; }
    .size-medium .events li:nth-child(n + 4) { display: none; }
    .size-medium .habits-list li:nth-child(n + 4) { display: none; }
  </style>
</head>
<body>
  <div class="widget" id="widget">
    <div class="head">
      <div class="date" id="date"></div>
      <div class="ring" id="ring"></div>
    </div>
    <div class="section" id="habits-title">Habits</div>
    <ul class="habits-list" id="habits"></ul>
    <div class="section">Coming up</div>
    <div class="events" id="events"></div>
    <div class="foot">
      <span id="updated"></span>
      <a href="index.html#today">Open Daybook →</a>
    </div>
  </div>
  <script type="module" src="js/widget.js"></script>
</body>
</html>
