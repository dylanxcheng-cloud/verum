<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daybook</title>
  <meta name="description" content="Daily habits, a journal, and the things people ask you to do — with reminders as notifications, a wallpaper, or a widget.">
  <meta name="theme-color" content="#1a73e8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Daybook">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar"><div class="inner">
    <span class="brand">Daybook</span>
    <div class="title" id="top-title"></div>
    <div class="row" id="top-actions" style="gap:0"></div>
  </div></header>

  <div class="app"><main>
    <section class="view" data-view="today"></section>
    <section class="view" data-view="habits"></section>
    <section class="view" data-view="events"></section>
    <section class="view" data-view="reminders"></section>
  </main></div>

  <button class="fab" id="fab" aria-label="Add" data-action="fab">
    <svg viewBox="0 0 36 36"><path fill="#34A853" d="M16 16v14h4V20z"/><path fill="#4285F4" d="M30 16H20l-4 4h14z"/><path fill="#FBBC05" d="M6 16v4h10l4-4z"/><path fill="#EA4335" d="M20 16V6h-4v14z"/></svg>
  </button>

  <dialog id="habit-dialog">
    <form id="habit-form">
      <div class="dlg-head"><button type="button" class="icon-btn" data-action="close-dialog" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4l5.6 5.6L5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6z"/></svg></button></div>
      <input class="title-input" type="text" id="habit-name" name="name" required maxlength="60" placeholder="Add habit" autocomplete="off">
      <div class="frow"><span class="ic"><svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14z"/></svg></span><div class="in"><div class="weekdays" id="habit-days"></div></div></div>
      <div class="frow"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></span><div class="in"><div class="swatches" id="habit-colors"></div></div></div>
      <div class="dialog-actions">
        <button type="button" class="btn text danger" id="habit-delete" data-action="habit-delete" hidden>Delete</button>
        <div class="right"><button type="submit" class="btn primary">Save</button></div>
      </div>
    </form>
  </dialog>

  <dialog id="event-dialog">
    <form id="event-form">
      <div class="dlg-head"><button type="button" class="icon-btn" data-action="close-dialog" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4l5.6 5.6L5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6z"/></svg></button></div>
      <input class="title-input" type="text" id="ev-title" name="title" required maxlength="100" placeholder="Add title" autocomplete="off">

      <div class="frow"><span class="ic"><svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg></span>
        <div class="in"><input type="date" id="ev-date" name="date" required><input type="time" id="ev-time" name="time"><label class="sw small"><input type="checkbox" id="ev-allday" name="allday"> All day</label></div></div>

      <div class="frow"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 14.8A5.87 5.87 0 0 1 6 12c0-3.31 2.69-6 6-6zm6.76 1.74L17.3 9.2c.44.84.7 1.79.7 2.8 0 3.31-2.69 6-6 6v-3l-4 4 4 4v-3c4.42 0 8-3.58 8-8 0-1.57-.46-3.03-1.24-4.26z"/></svg></span>
        <div class="in"><select id="ev-repeat" name="repeat"><option value="none">Does not repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Annually</option></select>
          <div class="weekdays" id="ev-weekdays" hidden></div></div></div>

      <div class="frow"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
        <div class="in"><input type="text" id="ev-from" name="from" maxlength="60" placeholder="Who asked (optional)"></div></div>

      <div class="frow"><span class="ic"><svg viewBox="0 0 24 24"><path d="M14 17H4v2h10v-2zm6-8H4v2h16V9zM4 15h16v-2H4v2zM4 5v2h16V5H4z"/></svg></span>
        <div class="in"><textarea id="ev-notes" name="notes" maxlength="1000" placeholder="Add description"></textarea></div></div>

      <div class="frow"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg></span>
        <div class="in"><label class="sw"><input type="checkbox" id="ev-push" name="push"> Notification</label><select id="ev-lead" name="lead" hidden></select></div></div>
      <div class="frow"><span class="ic"><svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></span>
        <div class="in"><label class="sw"><input type="checkbox" name="wallpaper" checked> Wallpaper</label></div></div>
      <div class="frow"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/></svg></span>
        <div class="in"><label class="sw"><input type="checkbox" name="widget" checked> Widget</label></div></div>
      <div class="frow"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></span><div class="in"><div class="swatches" id="ev-colors"></div></div></div>

      <div class="dialog-actions">
        <button type="button" class="btn text danger" id="event-delete" data-action="event-delete" hidden>Delete</button>
        <div class="right"><button type="submit" class="btn primary">Save</button></div>
      </div>
    </form>
  </dialog>

  <nav class="nav"><div class="inner">
    <button data-nav="today" class="active"><span class="pill"><svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14zM7 11h5v5H7z"/></svg></span>Today</button>
    <button data-nav="habits"><span class="pill"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span>Habits</button>
    <button data-nav="events"><span class="pill"><svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3zm0 4h2v-2H3zm0-8h2V7H3zm4 4h14v-2H7zm0 4h14v-2H7zM7 7v2h14V7z"/></svg></span>Events</button>
    <button data-nav="reminders"><span class="pill"><svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg></span>Remind</button>
  </div></nav>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
